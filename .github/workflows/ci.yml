# Continuous integration for NutriLenz.
# On every push and pull request, GitHub builds the Docker image and runs the tests
# INSIDE the container. No API key is needed: tests use fake AI replies.
# Part 2 is object-oriented, so the Part 1 "no class definitions" check is removed.
name: CI

on:
  push:
  pull_request:

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t nutrilenz .

      - name: Part 2 tests (pytest, fake AI replies, no API)
        run: docker run --rm nutrilenz python -m pytest tests -q -p no:cacheprovider

      - name: Part 1 test scripts (kept until the old modules are replaced)
        run: |
          for script in test_logic.py test_data.py test_ai_manager.py; do
            if [ -f "$script" ]; then docker run --rm nutrilenz python "$script"; fi
          done
